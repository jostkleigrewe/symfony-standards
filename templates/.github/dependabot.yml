# Standard: jostkleigrewe/symfony-standards (follows the Senior profile standard dependabot-1.0)
# Monthly, grouped (minor + patch per ecosystem, separate security group), no major bumps.
# github-actions raises the pinned workflow tag in .github/workflows/ci.yml (symfony-ci.yml@vX.Y.Z) by pull request,
# so every package release passes this project's CI before it is merged. Major releases of the package are ignored
# on purpose: they may turn a green project red and get their own change.
# No target-branch: Dependabot uses the default branch (develop). With target-branch, groups and commit-message
# would no longer apply to security updates (GitHub docs).
# Add an npm block with the same settings only if the project has a package.json.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      composer:
        patterns: ["*"]
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
