# Reusable workflow — called from a project's .github/workflows/ci.yml (template: templates/.github/workflows/ci.yml).
# The checks are `vendor/bin/symfony-standards check`, so a local run gives the same result as CI.
name: Symfony CI

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner as JSON: "ubuntu-latest" (GitHub) or ["self-hosted","senior-ci"] (central runner, see README)'
        type: string
        default: '"ubuntu-latest"'
      timeout-minutes:
        type: number
        default: 20
      php-version:
        description: PHP version, same as production (e.g. "8.4")
        type: string
        required: true
      php-extensions:
        description: Extra PHP extensions for shivammathur/setup-php
        type: string
        default: intl, pdo_mysql, zip
      mysql-version:
        description: Start a MySQL service of this version and set DATABASE_URL ("" = no database). Self-hosted runners use their CI database instead.
        type: string
        default: ''
      beta-branch:
        type: string
        default: develop
      live-branch:
        type: string
        default: master
    secrets:
      deploy-webhook-beta:
        required: false
      deploy-webhook-live:
        required: false

# No workflow-level permissions: a called workflow may only lower the caller's token rights, and a job asking for more
# than the caller grants fails the whole run at startup. The checks lower to read; the deploy job keeps the caller's.

jobs:
  checks:
    name: Checks
    permissions:
      contents: read
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    services:
      mysql:
        # An empty image means the service does not start (GitHub Actions workflow syntax).
        # Self-hosted runners have no Docker; they provide CI_DATABASE_* instead.
        image: ${{ inputs.mysql-version != '' && !contains(inputs.runs-on, 'self-hosted') && format('mysql:{0}', inputs.mysql-version) || '' }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: app
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        env:
          runner: ${{ runner.environment == 'self-hosted' && 'self-hosted' || 'github' }}
        with:
          php-version: ${{ inputs.php-version }}
          extensions: ${{ inputs.php-extensions }}
          coverage: none
          tools: composer:v2

      - name: Database URL
        if: inputs.mysql-version != ''
        env:
          MYSQL_VERSION: ${{ inputs.mysql-version }}
        run: |
          if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ] && [ -n "${CI_DATABASE_HOST:-}" ]; then
            # One database per run on the runner's CI database server (user may only use ci_*; max. 64 characters).
            short="$(basename "$GITHUB_REPOSITORY" | tr -c 'a-zA-Z0-9\n' '_' | cut -c1-20)"
            db="ci_${short}_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
            echo "DATABASE_URL=mysql://$CI_DATABASE_USER:$CI_DATABASE_PASSWORD@$CI_DATABASE_HOST:3306/$db?serverVersion=${CI_DATABASE_VERSION:-$MYSQL_VERSION}&charset=utf8mb4" >> "$GITHUB_ENV"
            echo "::add-mask::$CI_DATABASE_PASSWORD"
          else
            echo "DATABASE_URL=mysql://root:root@127.0.0.1:3306/app?serverVersion=$MYSQL_VERSION&charset=utf8mb4" >> "$GITHUB_ENV"
          fi

      - name: Composer cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ inputs.php-version }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ inputs.php-version }}-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Checks
        run: vendor/bin/symfony-standards check

  deploy:
    name: Deploy
    needs: checks
    if: >-
      github.event_name == 'push'
      && (github.ref_name == inputs.beta-branch || github.ref_name == inputs.live-branch)
    # Same runner as the checks: a hard-coded GitHub-hosted runner cannot start when hosted minutes are blocked
    # (coole-hufe, 2026-10-29: green checks, deploy job never started).
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 5
    # Inherits the caller's token. With `deployments: write` granted in ci.yml the job records a GitHub deployment per
    # environment (beta/live) — the rolled-out commit becomes visible on GitHub and in the hub. Without it: a warning.
    steps:
      - name: Trigger deploy webhook
        env:
          WEBHOOK: ${{ github.ref_name == inputs.live-branch && secrets.deploy-webhook-live || secrets.deploy-webhook-beta }}
          TARGET: ${{ github.ref_name == inputs.live-branch && 'live' || 'beta' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::notice title=Deploy::No $TARGET webhook secret set — nothing deployed."
            exit 0
          fi
          api() {
            curl --silent --show-error --max-time 30 -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" "$@"
          }
          repo_api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          deployment_id="$(api -X POST "$repo_api/deployments" -d "$(jq -n --arg ref "$GITHUB_SHA" --arg env "$TARGET" \
            '{ref: $ref, environment: $env, auto_merge: false, required_contexts: [], description: "Deploy webhook after green CI"}')" \
            | jq -r '.id // empty' || true)"
          if [ -z "$deployment_id" ]; then
            echo "::warning title=Deploy::GitHub deployment not recorded — grant 'deployments: write' in ci.yml"
          fi
          state=success
          curl --fail-with-body --silent --show-error --max-time 60 --retry 2 -X POST "$WEBHOOK" || state=failure
          if [ -n "$deployment_id" ]; then
            api -X POST "$repo_api/deployments/$deployment_id/statuses" -d "$(jq -n --arg state "$state" \
              --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              '{state: $state, log_url: $url, description: "Hosting webhook called"}')" >/dev/null || true
          fi
          if [ "$state" != success ]; then
            echo "::error title=Deploy::$TARGET webhook failed"
            exit 1
          fi
          echo "::notice title=Deploy::$TARGET deploy triggered for ${GITHUB_SHA::7}"
